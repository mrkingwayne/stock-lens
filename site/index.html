<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Lens 美股透視鏡</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0f17;--card:#121826;--line:#1f2a3d;--txt:#e6ebf5;--mut:#8a96ad;--up:#ef4451;--dn:#1fbf75;--acc:#4da3ff;--warn:#f5b942}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}.logo span{color:var(--acc)}
form{display:flex;flex:1;min-width:240px;max-width:520px;gap:8px;position:relative}
input{flex:1;background:#0f1522;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:16px;text-transform:uppercase}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
#sug{position:absolute;top:44px;left:0;right:70px;background:var(--card);border:1px solid var(--line);border-radius:10px;display:none;max-height:300px;overflow:auto}
#sug div{padding:8px 12px;cursor:pointer;font-size:14px}#sug div:hover{background:#1a2335}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px;color:#cfd7e6}h2 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-end}
.name{font-size:24px;font-weight:800}.name small{font-size:14px;color:var(--mut);font-weight:400;margin-left:8px}
.px{font-size:30px;font-weight:800}.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{background:#0f1522;border-radius:10px;padding:10px}.kv b{display:block;font-size:17px;margin-top:4px}.kv span{font-size:12px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mut)}
.bar i{display:block;width:100%;background:linear-gradient(var(--acc),#2a5c99);border-radius:4px 4px 0 0}
.news a{color:var(--txt);text-decoration:none;display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.news a:hover{color:var(--acc)}.news em{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:2px}
.tag{display:inline-block;background:#1a2335;border:1px solid #2a3953;border-radius:99px;padding:4px 10px;margin:0 6px 6px 0;font-size:13px}
#chart{height:460px}#rsi,#macd{height:110px;margin-top:4px}@media(max-width:600px){#chart{height:340px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:8px}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.disc{border:1px solid #5a4a1c;background:#2a2210;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sc .kv b{font-size:20px}
#msg{text-align:center;color:var(--mut);padding:60px 10px}.hide{display:none}p.sum{font-size:14px;line-height:1.75;color:#c8d0df}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px}
</style></head><body>
<header><div class="logo">Stock <span>Lens</span> 美股透視鏡</div>
<form id="f" autocomplete="off"><input id="q" placeholder="輸入美股代號，如 NVDA" ><button>查詢</button><div id="sug"></div></form>
<div class="chips" id="chips"></div></header>
<main><div id="msg">輸入美股代號開始查詢</div><div id="app" class="hide"></div></main>
<footer>資料來源：Yahoo Finance（股價、財報、分析師預估）、美國 SEC EDGAR XBRL（營收、剩餘履約義務 RPO、backlog）、Google News（新聞）。新聞與公司簡介為機器翻譯。<br>僅供參考，非投資建議，預測不保證準確。</footer>
<script>
const $=s=>document.querySelector(s);let IDX={};const REPO="mrkingwayne/stock-lens";
const fmt=(v,d=2)=>v==null||isNaN(v)?"無資料":Number(v).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const big=v=>{if(v==null||isNaN(v))return"無資料";const a=Math.abs(v);return a>=1e12?(v/1e12).toFixed(2)+" 兆":a>=1e8?(v/1e8).toFixed(1)+" 億":a>=1e4?(v/1e4).toFixed(0)+" 萬":v.toFixed(0)};
const pct=(v,d=1)=>v==null||isNaN(v)?"無資料":(v>0?"+":"")+(v*100).toFixed(d)+"%";
const cls=v=>v>0?"up":v<0?"dn":"";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
["NVDA","TSLA","LMT","AAPL","PLTR","AMD"].forEach(t=>{const c=document.createElement("span");c.className="chip";c.textContent=t;c.onclick=()=>go(t);$("#chips").appendChild(c)});
fetch("data/index.json").then(r=>r.json()).then(j=>IDX=j);
$("#q").oninput=e=>{const v=e.target.value.toUpperCase().trim();const s=$("#sug");if(!v){s.style.display="none";return}
 const m=Object.entries(IDX).filter(([k,n])=>k.startsWith(v)||(n||"").toUpperCase().includes(v)).slice(0,10);
 s.innerHTML=m.map(([k,n])=>`<div data-t="${k}"><b>${k}</b> <span class="mut">${esc(n)}</span></div>`).join("");s.style.display=m.length?"block":"none"};
$("#sug").onclick=e=>{const d=e.target.closest("div[data-t]");if(d)go(d.dataset.t)};
$("#f").onsubmit=e=>{e.preventDefault();go($("#q").value)};
window.onhashchange=()=>load(location.hash.slice(1));
function go(t){t=(t||"").toUpperCase().trim().replace(".","-");if(!t)return;$("#sug").style.display="none";$("#q").value=t;location.hash=t}
// ---- 指標 ----
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
const ema=(a,n)=>{const k=2/(n+1);let e=null;return a.map(v=>e=e==null?v:v*k+e*(1-k))};
function rsi(c,n=14){const o=[null];let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];if(i<=n){g+=Math.max(d,0);l+=Math.max(-d,0);o.push(i==n?100-100/(1+g/(l||1e-9)):null);if(i==n){g/=n;l/=n}}else{g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o.push(100-100/(1+g/(l||1e-9)))}}return o}
function macd(c){const a=ema(c,12),b=ema(c,26),m=a.map((v,i)=>v-b[i]),s=ema(m,9);return{m,s,h:m.map((v,i)=>v-s[i])}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r())}
function bizDays(last,n){const o=[];let d=new Date(last+"T00:00:00Z");while(o.length<n){d=new Date(d.getTime()+864e5);const w=d.getUTCDay();if(w&&w<6)o.push(d.toISOString().slice(0,10))}return o}
// ---- 預測模型（透明規則）----
function project(D){
 const C=D.candles.map(x=>x.c),N=C.length,last=C[N-1];
 const lr=C.slice(1).map((v,i)=>Math.log(v/C[i])),r60=lr.slice(-60);
 const mu60=r60.reduce((a,b)=>a+b,0)/r60.length,sig=Math.sqrt(r60.reduce((a,b)=>a+(b-mu60)**2,0)/(r60.length-1));
 const m20=sma(C,20)[N-1],m60=sma(C,60)[N-1],R=rsi(C)[N-1],M=macd(C).h[N-1],ret63=N>63?last/C[N-64]-1:null;
 const P=D.profile||{},inp=[];
 // 1 技術面：趨勢+動能
 let tech=0;const tr=m60?last/m60-1:0;tech+=clamp(tr*0.25,-0.04,0.04);inp.push(["股價相對 60 日均線",pct(tr),pct(clamp(tr*0.25,-0.04,0.04)),"站上均線視為多頭趨勢，取 25%，上下限 ±4%"]);
 const mom=ret63!=null?clamp(ret63*0.2,-0.05,0.05):0;tech+=mom;inp.push(["近 3 個月漲跌（動能）",pct(ret63),pct(mom),"動能延續假設，取 20%，上下限 ±5%"]);
 const ma=m20&&m60?(m20>m60?0.01:-0.01):0;tech+=ma;inp.push(["MA20 vs MA60",m20>m60?"黃金排列":"死亡排列",pct(ma),"±1%"]);
 const rs=R>70?-0.02:R<30?0.02:0;tech+=rs;inp.push(["RSI(14)",fmt(R,1),pct(rs),"超過 70 視為過熱 -2%，低於 30 視為超賣 +2%"]);
 const mc=M>0?0.005:-0.005;tech+=mc;inp.push(["MACD 柱狀體",fmt(M,2),pct(mc),"正值 +0.5%，負值 -0.5%"]);
 // 2 基本面
 let fund=0;const tgt=P.targetMeanPrice?P.targetMeanPrice/last-1:null;const a1=tgt!=null?clamp(tgt*0.25,-0.06,0.06):0;fund+=a1;
 inp.push(["分析師平均目標價",P.targetMeanPrice?fmt(P.targetMeanPrice)+`（${pct(tgt)}）`:"無資料",pct(a1),"目標價通常以 12 個月計，3 個月取 25%，上下限 ±6%"]);
 const rg=revYoY(D);const a2=rg!=null?clamp(rg/4*0.5,-0.03,0.04):0;fund+=a2;inp.push(["最新一季營收年增率",pct(rg),pct(a2),"年增率換算一季後取 50%，上下限 -3%~+4%"]);
 const pe=P.forwardPE,a3=pe==null?0:pe>60?-0.015:pe<15&&pe>0?0.01:0;fund+=a3;inp.push(["預估本益比 Forward P/E",fmt(pe,1),pct(a3),"高於 60 倍時估值偏貴 -1.5%，低於 15 倍 +1%"]);
 // 3 訂單 / 指引
 let ord=0;const ob=orderYoY(D);const a4=ob?clamp(ob.g/4*0.5,-0.02,0.03):0;ord+=a4;inp.push(["訂單 / RPO 年增",ob?`${ob.label} ${pct(ob.g)}`:"無資料（未申報）",pct(a4),"在手訂單增加代表未來營收能見度，取一季的 50%"]);
 const ge=guideG(D);const a5=ge!=null?clamp(ge/4*0.4,-0.02,0.03):0;ord+=a5;inp.push(["分析師預估下季營收成長",pct(ge),pct(a5),"市場共識（Yahoo）換算一季取 40%"]);
 const raw=tech+fund+ord,base=raw*0.6,H=63,vol3=sig*Math.sqrt(H);
 return {raw,last,sig,base,tech,fund,ord,vol3,inp,R,m20,m60,H};
}
function revYoY(D){const q=(D.sec&&D.sec.rev_q||[]);if(q.length>=5){const a=q[q.length-1],b=q.find(x=>Math.abs((new Date(a.end)-new Date(x.end))/864e5-365)<20);if(b&&b.val)return a.val/b.val-1}return D.profile&&D.profile.revenueGrowth!=null?D.profile.revenueGrowth:null}
function orderYoY(D){const s=D.sec||{};const src=[...(s.backlog||[]).map(b=>({label:"Backlog",ser:b.series})),{label:"RPO",ser:s.rpo||[]}];
 for(const o of src){const q=o.ser;if(q.length<2)continue;const a=q[q.length-1],b=q.find(x=>Math.abs((new Date(a.end)-new Date(x.end))/864e5-365)<25);if(b&&b.val)return{label:o.label,g:a.val/b.val-1,a,b}}return null}
function guideG(D){const e=D.estimates&&D.estimates.revenue_estimate;if(!e)return null;const k=e["+1q"]||e["0q"];return k&&k.growth!=null?k.growth:null}
// ---- 繪圖 ----
let charts=[];
function draw(D,PJ){charts.forEach(c=>c.remove());charts=[];
 const opt=h=>({height:h,layout:{background:{color:"transparent"},textColor:"#8a96ad"},grid:{vertLines:{color:"#161f2e"},horzLines:{color:"#161f2e"}},rightPriceScale:{borderColor:"#1f2a3d"},timeScale:{borderColor:"#1f2a3d"},crosshair:{mode:0},localization:{locale:"zh-TW"}});
 const el=$("#chart"),ch=LightweightCharts.createChart(el,{...opt(el.clientHeight),width:el.clientWidth});charts.push(ch);
 const cs=D.candles.slice(-260),C=D.candles.map(x=>x.c),off=D.candles.length-cs.length;
 const k=ch.addCandlestickSeries({upColor:"#ef4451",downColor:"#1fbf75",borderUpColor:"#ef4451",borderDownColor:"#1fbf75",wickUpColor:"#ef4451",wickDownColor:"#1fbf75"});
 k.setData(cs.map(x=>({time:x.t,open:x.o,high:x.h,low:x.l,close:x.c})));
 const vol=ch.addHistogramSeries({priceScaleId:"v",priceFormat:{type:"volume"}});ch.priceScale("v").applyOptions({scaleMargins:{top:.82,bottom:0}});
 vol.setData(cs.map(x=>({time:x.t,value:x.v,color:x.c>=x.o?"rgba(239,68,81,.35)":"rgba(31,191,117,.35)"})));
 [[20,"#f5b942"],[60,"#b37cff"]].forEach(([n,c])=>{const m=sma(C,n);const s=ch.addLineSeries({color:c,lineWidth:1,priceLineVisible:false,lastValueVisible:false});s.setData(cs.map((x,i)=>({time:x.t,value:m[i+off]})).filter(p=>p.value))});
 // 預測
 const fd=bizDays(cs[cs.length-1].t,PJ.H),L=PJ.last,lt=cs[cs.length-1].t;
 const path=(z)=>[{time:lt,value:L},...fd.map((t,i)=>{const f=(i+1)/PJ.H;return{time:t,value:L*Math.exp(Math.log(1+PJ.base)*f+z*PJ.sig*Math.sqrt(i+1))}})];
 const ls=(c,w,st)=>ch.addLineSeries({color:c,lineWidth:w,lineStyle:st,priceLineVisible:false,lastValueVisible:true,crosshairMarkerVisible:false});
 ls("rgba(239,68,81,.9)",2,2).setData(path(1));ls("rgba(77,163,255,1)",2,2).setData(path(0));ls("rgba(31,191,117,.9)",2,2).setData(path(-1));
 ls("rgba(239,68,81,.35)",1,1).setData(path(2));ls("rgba(31,191,117,.35)",1,1).setData(path(-2));
 // 模擬日K（基準情境附近的一條隨機路徑）
 const r=rng(D.ticker+lt),sim=[];let p=L;const dr=Math.log(1+PJ.base)/PJ.H;
 fd.forEach((t,i)=>{const target=L*Math.exp(dr*(i+1));let n=p*Math.exp(dr+PJ.sig*gauss(r)*0.8+0.15*Math.log(target/p));const o=p,hi=Math.max(o,n)*(1+Math.abs(gauss(r))*PJ.sig*.4),lo=Math.min(o,n)*(1-Math.abs(gauss(r))*PJ.sig*.4);sim.push({time:t,open:o,high:hi,low:lo,close:n});p=n});
 const sk=ch.addCandlestickSeries({upColor:"rgba(239,68,81,.28)",downColor:"rgba(31,191,117,.28)",borderUpColor:"rgba(239,68,81,.6)",borderDownColor:"rgba(31,191,117,.6)",wickUpColor:"rgba(239,68,81,.5)",wickDownColor:"rgba(31,191,117,.5)",priceLineVisible:false,lastValueVisible:false});
 sk.setData(sim);k.setMarkers([{time:lt,position:"aboveBar",color:"#f5b942",shape:"arrowDown",text:"今日 → 預測情境"}]);
 ch.timeScale().setVisibleLogicalRange({from:cs.length-200,to:cs.length+PJ.H+3});
 // RSI / MACD
 const sub=(id)=>{const e=$(id),c=LightweightCharts.createChart(e,{...opt(e.clientHeight),width:e.clientWidth,timeScale:{visible:false}});charts.push(c);return c};
 const rc=sub("#rsi"),R=rsi(C),rl=rc.addLineSeries({color:"#4da3ff",lineWidth:1,priceLineVisible:false});rl.setData(cs.map((x,i)=>({time:x.t,value:R[i+off]})).filter(p=>p.value!=null));
 rl.createPriceLine({price:70,color:"#ef4451",lineStyle:2,lineWidth:1});rl.createPriceLine({price:30,color:"#1fbf75",lineStyle:2,lineWidth:1});
 const mc=sub("#macd"),M=macd(C);mc.addHistogramSeries({priceLineVisible:false}).setData(cs.map((x,i)=>({time:x.t,value:M.h[i+off],color:M.h[i+off]>=0?"rgba(239,68,81,.6)":"rgba(31,191,117,.6)"})));
 mc.addLineSeries({color:"#f5b942",lineWidth:1,priceLineVisible:false}).setData(cs.map((x,i)=>({time:x.t,value:M.m[i+off]})));mc.addLineSeries({color:"#b37cff",lineWidth:1,priceLineVisible:false}).setData(cs.map((x,i)=>({time:x.t,value:M.s[i+off]})));
 // 同步時間軸（包含預測區）
 [rc,mc].forEach(c=>{rl.applyOptions({});c.timeScale().applyOptions({rightOffset:PJ.H+3})});
 ch.timeScale().subscribeVisibleLogicalRangeChange(rg=>{if(rg)[rc,mc].forEach(c=>c.timeScale().setVisibleLogicalRange(rg))});
 new ResizeObserver(()=>charts.forEach(c=>{const e=c.chartElement().parentElement;c.applyOptions({width:e.clientWidth})})).observe(el);
}
// ---- 頁面 ----
async function load(t){if(!t)return;t=t.toUpperCase();$("#msg").textContent="載入 "+t+" 中…";$("#msg").classList.remove("hide");$("#app").classList.add("hide");
 let D=null;try{const r=await fetch("data/"+t+".json?v="+Date.now().toString().slice(0,-5));if(r.ok)D=await r.json()}catch(e){}
 if(!D){D=await live(t);if(!D){$("#msg").innerHTML=`找不到 <b>${esc(t)}</b> 的資料。請確認代號是否正確（例：BRK-B）。<br><br><a style="color:#4da3ff" target="_blank" href="https://github.com/${REPO}/issues/new?title=build:${t}&body=請建立 ${t} 的完整資料">➜ 請求建立 ${esc(t)} 完整資料（需登入 GitHub，約 2–3 分鐘）</a>`;return}}
 render(D)}
async function live(t){// 不在資料庫的代號：透過公開 CORS 代理即時抓 Yahoo 日K（只有技術面）
 const u=`https://query1.finance.yahoo.com/v8/finance/chart/${t}?range=14mo&interval=1d`;
 for(const p of [x=>"https://api.allorigins.win/raw?url="+encodeURIComponent(x),x=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(x),x=>"https://corsproxy.io/?url="+encodeURIComponent(x)]){
  try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),12000);const j=await (await fetch(p(u),{signal:ctl.signal})).json();const r=j.chart.result[0],q=r.indicators.quote[0];
   const candles=r.timestamp.map((s,i)=>({t:new Date((s+r.meta.gmtoffset)*1e3).toISOString().slice(0,10),o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i],v:q.volume[i]||0})).filter(x=>x.c!=null);
   if(candles.length<70)continue;return{ticker:t,live:true,profile:{shortName:r.meta.longName||r.meta.shortName||t,currency:r.meta.currency,exchange:r.meta.exchangeName},candles,earnings:[],quarterly:[],estimates:{},sec:{},news:[],order_news:[],themes:[]}}catch(e){}}
 return null}
function render(D){const P=D.profile||{},C=D.candles,l=C[C.length-1],pv=C[C.length-2],chg=l.c/pv.c-1,PJ=project(D);
 const E=(D.earnings||[]).filter(e=>e.act!=null),ne=(D.earnings||[]).filter(e=>e.act==null).slice(-1)[0],le=E[0];
 const Q=(D.quarterly||[]).filter(x=>x.rev!=null),q0=Q[0],q4=Q.find(x=>q0&&Math.abs((new Date(q0.end)-new Date(x.end))/864e5-365)<20);
 const rq=(D.sec&&D.sec.rev_q||[]).slice(-8);const mx=Math.max(...rq.map(x=>x.val),1);
 const sc=[["樂觀情境",Math.exp(Math.log(1+PJ.base)+PJ.vol3)-1,"up"],["基準情境",PJ.base,""],["悲觀情境",Math.exp(Math.log(1+PJ.base)-PJ.vol3)-1,"dn"]];
